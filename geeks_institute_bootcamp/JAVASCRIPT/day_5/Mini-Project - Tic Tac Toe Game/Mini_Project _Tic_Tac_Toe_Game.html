<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe AI</title>
  <link rel="stylesheet" href="Mini_Project _Tic_Tac_Toe_Game.css">
</head>
<body>

<h1>Tic Tac Toe</h1>

<div class="controls">
  <button onclick="choosePlayer('X')">Play X</button>
  <button onclick="choosePlayer('O')">Play O</button>

  <select id="difficulty">
    <option value="easy">Easy</option>
    <option value="hard">Hard</option>
  </select>
</div>

<div id="board"></div>

<h2 id="status"></h2>

<button id="restart" onclick="restartGame()" style="display:none;">
  Restart
</button>

<script src="Mini_Project _Tic_Tac_Toe_Game.js"></script>
</body>
</html>
